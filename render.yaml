services:
  - type: web
    name: coffeepos-backend
    runtime: node
    rootDir: CoffeePOS/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LICENSE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
